<!doctype html>
<html lang="en-GB" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05090f"/>
<meta name="description" content="Anima is an educational 3D model of the human body. Turn it around, take it apart layer by layer and look up any named structure, in your browser. Not medical advice."/>
<title>Anima - Human Anatomy</title>
<link rel="icon" href="/favicon.svg"/>
<!-- Start the manifest download immediately, in parallel with the JavaScript bundle. -->
<script>window.__animaBoot={manifest:fetch('%BASE_URL%models/manifest.json',{cache:'no-cache'})};</script>
<style>
/* Splash screen: inline so it paints on the first frame, before any script loads. */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse 60% 55% at 50% 45%,rgb(40 120 140/.25),transparent 70%),#05090f;color:#e7f2f6;font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;transition:opacity .6s ease,visibility .6s;}
#splash[data-state=leaving]{opacity:0;visibility:hidden;pointer-events:none}
#splash .card{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
#splash .mark{width:56px;height:56px;border-radius:50%;border:1.5px solid #4fe3d6;position:relative;box-shadow:0 0 24px rgb(79 227 214/.35)}
#splash .mark::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#4fe3d6;animation:anima-beat 1.4s ease-in-out infinite}
#splash h1{margin:6px 0 0;font-size:18px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em}
#splash p{margin:0;color:#93a8b4;font-size:13px}
#splash .note{font-size:11px;color:#62788a;max-width:32ch}
@keyframes anima-beat{0%,100%{transform:scale(.82)}15%{transform:scale(1)}30%{transform:scale(.88)}45%{transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){#splash .mark::after{animation:none}#splash{transition:none}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-busy="true">
  <div class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Anima</h1>
    <p id="splash-status">Assembling the body…</p>
    <p class="note">Educational model, not medical advice. Anatomy data: BodyParts3D © DBCLS, CC BY 4.0.</p>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
